<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A magnifying glass over a handwritten prescription slip frames one line of the handwriting, and a dotted lead carries it to a proposal card with a confidence meter and a tick box, so every proposed change shows its source.">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.208  0 0 0 0 0.118  0 0 0 0 0.157  3.5 0 0 0 -2.1" result="specks"/>
      <feComposite in="specks" in2="SourceGraphic" operator="in" result="ink"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="ink"/></feMerge>
    </filter>
  </defs>
  <clipPath id="lensclip"><path d="M194 300 C194 246 238 202 292 202 C346 202 390 246 390 300 C390 354 346 398 292 398 C238 398 194 354 194 300 Z"/></clipPath>
  <g filter="url(#grain)">
    <rect width="800" height="600" fill="#FF5C34"/>
    <g filter="url(#wobble)">
      <g transform="translate(4 3)" fill="#D7EFFF" stroke="none">
        <path transform="rotate(-5 290 305)" d="M142 142 C220 138 360 137 438 140 C442 240 443 380 440 468 C360 472 220 472 140 470 C137 380 138 240 142 142 Z"/>
        <path transform="rotate(4 596 305)" d="M502 172 C560 169 640 168 690 171 C693 260 693 360 690 438 C640 441 560 442 502 440 C499 360 499 260 502 172 Z"/>
      </g>
